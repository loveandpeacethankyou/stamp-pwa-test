<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Photo Picker Test</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;padding:24px;line-height:1.5}
section{margin:0 0 28px}
input{font-size:18px;display:block;margin:10px 0}
img{max-width:180px;max-height:180px;border-radius:12px;display:none;margin-top:10px}
pre{white-space:pre-wrap;background:#f3f3f3;padding:10px;border-radius:8px}
</style>
</head>
<body>
<h1>写真選択テスト</h1>

<section>
<h2>A：画像だけ</h2>
<input id="a" type="file" accept="image/*">
<pre id="alog">未選択</pre>
<img id="ap">
</section>

<section>
<h2>B：制限なし</h2>
<input id="b" type="file">
<pre id="blog">未選択</pre>
<img id="bp">
</section>

<section>
<h2>C：画像＋複数選択</h2>
<input id="c" type="file" accept="image/*" multiple>
<pre id="clog">未選択</pre>
</section>

<script>
function setup(id, logId, imgId){
  const input=document.getElementById(id);
  const log=document.getElementById(logId);
  const img=imgId ? document.getElementById(imgId) : null;
  input.addEventListener('change', ()=>{
    if(!input.files || !input.files.length){
      log.textContent='選択されませんでした';
      return;
    }
    const f=input.files[0];
    log.textContent=`選択成功
name: ${f.name}
type: ${f.type || '(なし)'}
size: ${f.size} bytes
files: ${input.files.length}`;
    if(img && f.type.startsWith('image/')){
      img.src=URL.createObjectURL(f);
      img.style.display='block';
    }
  });
}
setup('a','alog','ap');
setup('b','blog','bp');
setup('c','clog');
</script>
</body>
</html>
