<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stamp Card">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>Stamp Card</title>
  <style>
    :root{
      --bg:#f4f0e8;
      --paper:#fffdf8;
      --ink:#292724;
      --muted:#8c877f;
      --line:#ddd6cb;
      --soft:#ece6dc;
      --danger:#9f3d3d;
      --shadow:0 10px 30px rgba(55,45,30,.08);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:var(--bg);
    }
    *{box-sizing:border-box}
    html,body{
      width:100%;
      max-width:100%;
      overflow-x:hidden;
      overscroll-behavior-x:none;
    }
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      -webkit-tap-highlight-color:transparent;
      padding-bottom:calc(78px + env(safe-area-inset-bottom));
    }
    button,input,textarea,select{font:inherit}
    button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
    .app{
      width:min(100%,560px);
      margin:0 auto;
      min-height:100vh;
      padding:calc(12px + env(safe-area-inset-top)) 16px 24px;
    }
    .topbar{
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;
      min-height:48px;
      margin-bottom:8px;
    }
    .topbar h1{
      text-align:center;
      font-size:17px;
      margin:0;
      font-weight:750;
      letter-spacing:.02em;
    }
    .icon-btn{
      border:0;
      width:40px;
      height:40px;
      border-radius:50%;
      background:transparent;
      color:var(--ink);
      font-size:22px;
      display:grid;
      place-items:center;
    }
    .icon-btn:active{background:var(--soft)}
    .date-row{
      display:grid;
      grid-template-columns:48px 1fr 48px;
      align-items:center;
      gap:8px;
      margin:4px 0 8px;
    }
    .date-main{
      text-align:center;
    }
    .date-main .date{
      font-size:31px;
      line-height:1.1;
      font-weight:800;
      letter-spacing:.01em;
    }
    .date-main .weekday{
      color:var(--muted);
      font-size:14px;
      margin-top:5px;
    }
    .round-btn{
      width:46px;
      height:46px;
      border-radius:50%;
      border:1px solid var(--line);
      background:var(--paper);
      font-size:24px;
      box-shadow:0 3px 12px rgba(55,45,30,.05);
    }
    .today-btn{
      display:block;
      margin:0 auto 8px;
      padding:5px 10px;
      border:0;
      background:transparent;
      color:var(--muted);
      font-size:13px;
    }
    .reorder-banner{
      display:none !important;
    }
    .card{
      background:var(--paper);
      border:1px solid rgba(90,75,50,.08);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:18px;
    }
    .stamp-grid{
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:18px 10px;
      justify-items:center;
      min-height:0;
      align-items:start;
    }
    .stamp-wrap{
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      width:100%;
      text-align:center;
      user-select:none;
    }
    .stamp{
      touch-action:manipulation;
      -webkit-user-select:none;
      user-select:none;
      width:min(25vw,104px);
      max-width:104px;
      aspect-ratio:1;
      border-radius:50%;
      border:2px dashed #c9c1b7;
      background:#faf7f1;
      color:#aaa298;
      display:grid;
      place-items:center;
      padding:9px;
      margin:0 auto;
      overflow:hidden;
      position:relative;
      transition:filter .08s ease, opacity .08s ease, transform .05s ease;
    }
    .stamp:active{transform:scale(.98)}
    .stamp.off{
      font-weight:750;
      font-size:15px;
      line-height:1.25;
      word-break:break-word;
    }
    .stamp.on{
      border-style:solid;
      border-color:transparent;
      font-weight:900;
      font-size:16px;
      line-height:1.2;
      color:#fff;
    }
    .stamp.on img{
      width:100%;
      height:100%;
      position:absolute;
      inset:0;
      object-fit:cover;
      border-radius:50%;
    }
    .stamp-caption{
      margin-top:7px;
      min-height:17px;
      font-size:12px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .empty{
      grid-column:1/-1;
      align-self:center;
      text-align:center;
      color:var(--muted);
      font-size:14px;
      padding:30px 10px;
    }
    .memo{
      margin-top:18px;
    }
    .memo + .memo{
      margin-top:7px;
    }
    .memo label{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin:0 0 7px 4px;
    }
    .memo textarea{
      width:100%;
      min-height:68px;
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.6);
      color:var(--ink);
      padding:12px 13px;
      resize:vertical;
      outline:none;
      font-size:15px;
    }
    .diary-images{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-top:10px;
    }
    .diary-image-item{
      width:72px;
      height:72px;
      border-radius:14px;
      overflow:visible;
      position:relative;
      flex:0 0 auto;
    }
    .diary-image-thumb{
      width:72px;
      height:72px;
      border:0;
      padding:0;
      border-radius:14px;
      overflow:hidden;
      background:#eee8df;
      display:block;
    }
    .diary-image-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      pointer-events:none;
    }
    .diary-image-remove{
      position:absolute;
      right:-6px;
      top:-6px;
      width:24px;
      height:24px;
      border:0;
      border-radius:50%;
      background:var(--ink);
      color:#fff;
      display:grid;
      place-items:center;
      font-size:15px;
      line-height:1;
      padding:0;
      box-shadow:0 2px 6px rgba(0,0,0,.18);
    }
    .diary-image-add{
      width:72px;
      height:72px;
      border:2px dashed var(--line);
      border-radius:14px;
      background:#faf7f1;
      color:#9e968c;
      font-size:28px;
      display:grid;
      place-items:center;
      padding:0;
    }
    .day{position:relative}
    .day-photo-indicator{
      position:absolute;
      top:6px;
      right:5px;
      font-size:10px;
      line-height:1;
      opacity:.7;
    }
    .photo-viewer-overlay{
      z-index:90;
      align-items:center;
      padding:18px;
    }
    .photo-viewer{
      width:min(100%,520px);
      max-height:88vh;
      border-radius:20px;
      background:#151515;
      overflow:hidden;
      position:relative;
      display:grid;
      place-items:center;
    }
    .photo-viewer img{
      max-width:100%;
      max-height:88vh;
      display:block;
      object-fit:contain;
    }
    .photo-viewer-close{
      position:absolute;
      top:10px;
      right:10px;
      z-index:2;
      width:36px;
      height:36px;
      border:0;
      border-radius:50%;
      background:rgba(0,0,0,.65);
      color:#fff;
      font-size:20px;
      display:grid;
      place-items:center;
    }
    .memo textarea:focus{border-color:#aaa096}
    .calendar-head{
      display:grid;
      grid-template-columns:44px 1fr 44px;
      align-items:center;
      margin:4px 0 16px;
    }
    .calendar-head h2{
      margin:0;
      text-align:center;
      font-size:22px;
    }
    .week-row,.calendar-grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:4px;
    }
    .week-row{
      margin-bottom:4px;
      color:var(--muted);
      font-size:11px;
      text-align:center;
    }
    .day{
      min-height:72px;
      border:0;
      border-radius:13px;
      background:transparent;
      padding:6px 4px 4px;
      text-align:left;
      color:var(--ink);
      overflow:hidden;
    }
    .day:active{background:var(--soft)}
    .day.out{opacity:.18}
    .day.today{outline:1px solid #bdb4aa}
    .day.selected{background:#ebe4da}
    .day-num{
      font-size:12px;
      margin-left:2px;
      margin-bottom:5px;
    }
    .mini-stamps{
      display:grid;
      grid-template-columns:repeat(2,15px);
      gap:3px;
      min-height:33px;
      align-content:start;
      justify-content:start;
    }
    .mini-stamp{
      width:15px;
      height:15px;
      border-radius:50%;
      background:#777;
      display:grid;
      place-items:center;
      color:white;
      font-size:8px;
      font-weight:800;
      overflow:hidden;
      position:relative;
    }
    .mini-stamp img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .mini-more{
      font-size:9px;
      color:var(--muted);
      align-self:center;
      white-space:nowrap;
      padding-left:1px;
    }
    .bottom-nav{
      position:fixed;
      z-index:20;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:min(100%,560px);
      padding:8px 16px calc(8px + env(safe-area-inset-bottom));
      background:rgba(244,240,232,.94);
      backdrop-filter:blur(16px);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      border-top:1px solid rgba(90,75,50,.08);
    }
    .nav-btn{
      border:0;
      border-radius:14px;
      padding:9px 10px;
      background:transparent;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
    }
    .nav-btn.active{
      background:var(--paper);
      color:var(--ink);
      box-shadow:0 3px 12px rgba(55,45,30,.06);
    }
    .screen{display:none}
    .screen.active{display:block}
    .overlay{
      position:fixed;
      z-index:50;
      inset:0;
      background:rgba(32,28,24,.34);
      display:none;
      align-items:flex-end;
      justify-content:center;
    }
    .overlay.open{display:flex}
    .sheet{
      width:min(100%,560px);
      max-height:88vh;
      overflow-y:auto;
      overflow-x:hidden;
      overscroll-behavior-x:none;
      touch-action:pan-y;
      background:var(--paper);
      border-radius:24px 24px 0 0;
      padding:18px 18px calc(22px + env(safe-area-inset-bottom));
      box-shadow:0 -16px 40px rgba(0,0,0,.12);
    }
    .sheet-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:16px;
    }
    .sheet-head h2{
      margin:0;
      font-size:20px;
    }
    .close-btn{
      border:0;
      background:var(--soft);
      width:36px;height:36px;border-radius:50%;
      font-size:18px;
    }
    .primary,.secondary,.danger-btn{
      border:0;
      border-radius:14px;
      padding:11px 14px;
      font-weight:750;
    }
    .primary{background:var(--ink);color:#fff}
    .secondary{background:var(--soft);color:var(--ink)}
    .danger-btn{background:#f3e4e4;color:var(--danger)}
    .full{width:100%}
    .manage-list{display:grid;gap:10px}
    .manage-item{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
    }
    .manage-title{font-weight:800}
    .manage-meta{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
    }
    .manage-actions{display:flex;gap:6px}
    .small-btn{
      border:0;border-radius:11px;padding:7px 9px;
      background:var(--soft);color:var(--ink);font-size:12px;font-weight:700;
    }
    .small-btn.danger{color:var(--danger);background:#f3e4e4}
    .field{margin:14px 0}
    .field > label{
      display:block;
      margin-bottom:6px;
      font-size:13px;
      color:var(--muted);
    }
    .field input[type="text"],.field input[type="date"],.field select{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      padding:11px 12px;
      color:var(--ink);
      outline:none;
    }
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .chips{display:flex;gap:7px;flex-wrap:wrap}
    .chip input{display:none}
    .chip span{
      display:grid;place-items:center;
      min-width:38px;height:38px;
      padding:0 8px;
      border-radius:999px;
      background:var(--soft);
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      border:1px solid transparent;
    }
    .chip input:checked + span{
      background:var(--ink);
      color:#fff;
    }
    .toggle-row{
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;
    }
    .toggle-row input{width:22px;height:22px}
    .image-gallery{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:10px;
    }
    .image-item{
      width:82px;
      flex:0 0 auto;
      text-align:center;
      position:relative;
    }
    .image-thumb{
      width:76px;
      height:76px;
      border-radius:50%;
      border:0;
      padding:0;
      margin:0 auto;
      display:block;
      overflow:hidden;
      background:#faf7f1;
      box-shadow:0 0 0 1px var(--line);
      touch-action:manipulation;
    }
    .image-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
      display:block;
      background:#faf7f1;
      pointer-events:none;
    }
    .image-edit-label{
      display:block;
      margin-top:5px;
      font-size:10px;
      color:var(--muted);
    }
    .crop-editor-overlay{
      z-index:70;
      align-items:center;
      padding:24px 18px;
    }
    .crop-editor{
      width:min(100%,420px);
      background:var(--paper);
      border-radius:24px;
      padding:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.22);
      text-align:center;
    }
    .crop-editor h2{
      margin:0 0 6px;
      font-size:20px;
    }
    .crop-help{
      color:var(--muted);
      font-size:12px;
      margin-bottom:16px;
    }
    .crop-preview{
      width:min(72vw,260px);
      aspect-ratio:1;
      border-radius:50%;
      overflow:hidden;
      margin:0 auto 16px;
      background:#eee7dd;
      border:2px solid var(--line);
      touch-action:none;
      position:relative;
    }
    .crop-preview img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }
    .crop-zoom{
      margin:0 auto 16px;
      width:min(72vw,260px);
      text-align:left;
    }
    .crop-zoom-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:6px;
      font-size:12px;
      color:var(--muted);
    }
    .crop-zoom input[type="range"]{
      width:100%;
    }
    .crop-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .image-remove{
      position:absolute;
      right:0;
      top:-5px;
      width:24px;
      height:24px;
      border:0;
      border-radius:50%;
      background:var(--ink);
      color:#fff;
      font-size:15px;
      line-height:1;
      display:grid;
      place-items:center;
      padding:0;
      box-shadow:0 2px 6px rgba(0,0,0,.18);
    }
    .image-add{
      width:82px;
      flex:0 0 auto;
      border:0;
      background:transparent;
      padding:0;
      text-align:center;
      color:var(--muted);
    }
    .image-add-circle{
      width:76px;
      height:76px;
      margin:0 auto;
      border-radius:50%;
      border:2px dashed var(--line);
      background:#faf7f1;
      display:grid;
      place-items:center;
      font-size:32px;
      line-height:1;
      color:#9e968c;
      font-weight:400;
    }
    .image-add-label{
      display:block;
      margin-top:5px;
      font-size:10px;
      color:var(--muted);
    }
    .help{font-size:12px;color:var(--muted);line-height:1.5}
    .version{
      color:var(--muted);
      text-align:center;
      font-size:11px;
      margin-top:18px;
    }
  </style>
</head>
<body>
<div class="app">
  <section id="homeScreen" class="screen active">
    <div class="topbar">
      <div></div>
      <h1>STAMP CARD</h1>
      <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙︎</button>
    </div>

    <div class="date-row">
      <button id="prevDayBtn" class="round-btn" aria-label="前の日">‹</button>
      <div class="date-main">
        <div id="homeDate" class="date"></div>
        <div id="homeWeekday" class="weekday"></div>
      </div>
      <button id="nextDayBtn" class="round-btn" aria-label="次の日">›</button>
    </div>
    <button id="todayBtn" class="today-btn">今日に戻る</button>

    <div id="reorderBanner" class="reorder-banner">
      <span>スタンプをドラッグして並べ替え</span>
      <button id="reorderDoneBtn" type="button">完了</button>
    </div>

    <div class="card">
      <div id="stampGrid" class="stamp-grid"></div>
      <div class="memo">
        <label for="memoInput">スタンプメモ</label>
        <textarea id="memoInput" placeholder=""></textarea>
      </div>

      <div class="memo">
        <label for="diaryInput">日記</label>
        <textarea id="diaryInput" placeholder=""></textarea>
        <input id="diaryImageInput" type="file" accept="image/*" multiple hidden>
        <div id="diaryImages" class="diary-images"></div>
      </div>
    </div>
  </section>

  <section id="calendarScreen" class="screen">
    <div class="topbar">
      <div></div>
      <h1>CALENDAR</h1>
      <button id="calendarSettingsBtn" class="icon-btn" aria-label="設定">⚙︎</button>
    </div>
    <div class="card">
      <div class="calendar-head">
        <button id="prevMonthBtn" class="icon-btn" aria-label="前の月">‹</button>
        <h2 id="calendarTitle"></h2>
        <button id="nextMonthBtn" class="icon-btn" aria-label="次の月">›</button>
      </div>
      <div class="week-row">
        <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </div>
  </section>
</div>

<nav class="bottom-nav">
  <button id="homeNav" class="nav-btn active">今日</button>
  <button id="calendarNav" class="nav-btn">カレンダー</button>
</nav>

<div id="settingsOverlay" class="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2>設定</h2>
      <button class="close-btn" data-close="settingsOverlay">×</button>
    </div>
    <button id="newQuestFromSettings" class="primary full">＋ スタンプを追加</button>
    <h3 style="font-size:15px;margin:20px 0 10px">スタンプ管理</h3>
    <div id="manageList" class="manage-list"></div>
    <div class="version">Stamp Card v1.9.3</div>
  </div>
</div>

<div id="questOverlay" class="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="questFormTitle">スタンプ追加</h2>
      <button class="close-btn" data-close="questOverlay">×</button>
    </div>
    <form id="questForm">
      <input id="questId" type="hidden">

      <div class="field">
        <label for="questName">スタンプ名</label>
        <input id="questName" type="text" maxlength="20" placeholder="名前を入力" required>
      </div>

      <div class="field">
        <label for="questType">種類</label>
        <select id="questType">
          <option value="daily">毎日</option>
          <option value="weekday">曜日指定</option>
          <option value="single">単発</option>
        </select>
      </div>

      <div id="weekdayField" class="field" style="display:none">
        <label>曜日（複数選択可）</label>
        <div class="chips">
          <label class="chip"><input type="checkbox" value="0"><span>日</span></label>
          <label class="chip"><input type="checkbox" value="1"><span>月</span></label>
          <label class="chip"><input type="checkbox" value="2"><span>火</span></label>
          <label class="chip"><input type="checkbox" value="3"><span>水</span></label>
          <label class="chip"><input type="checkbox" value="4"><span>木</span></label>

      <button class="primary full" type="submit" style="margin-top:8px">保存</button>

<script>
(() => {
  "use strict";

  const DB_NAME = "stamp-card-app";
  const DB_VERSION = 1;
  const STORE = "kv";
  const STATE_KEY = "state";

  let state = null;
  let selectedDate = todayStr();
  let calendarCursor = firstOfMonth(parseDate(selectedDate));
  let pendingImages = [];
  let editingCropIndex = null;
  let cropDrag = null;
  let memoTimer = null;
  let diaryTimer = null;

  let reorderMode = false;
  let reorderLongPressTimer = null;
  let reorderTouchStart = null;
  let reorderDragQuestId = null;
  let reorderDropQuestId = null;
  let reorderDropSide = "before";

  const $ = id => document.getElementById(id);

  function uid(prefix="id"){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  function pad(n){ return String(n).padStart(2,"0"); }

  function toDateStr(d){
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function todayStr(){ return toDateStr(new Date()); }

  function parseDate(s){
    const [y,m,d] = s.split("-").map(Number);
    return new Date(y,m-1,d,12,0,0,0);
  }

  function addDays(s,n){
    const d = parseDate(s);
    d.setDate(d.getDate()+n);
    return toDateStr(d);
  }

  function firstOfMonth(d){
    return new Date(d.getFullYear(), d.getMonth(), 1, 12);
  }

  function sameMonth(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth();
  }

  function initialState(){
    return {
      schemaVersion: 2,
      quests: [],
      styles: [],
      completions: [],
      memos: {},
      diaries: {},
      diaryImages: {}
    };
  }

  function normalizeState(saved){
    const base = initialState();
    const next = saved && typeof saved==="object" ? saved : {};
    return {
      ...base,
      ...next,
      quests:Array.isArray(next.quests) ? next.quests : [],
      styles:Array.isArray(next.styles) ? next.styles : [],
      completions:Array.isArray(next.completions) ? next.completions : [],
      memos:next.memos && typeof next.memos==="object" ? next.memos : {},
      diaries:next.diaries && typeof next.diaries==="object" ? next.diaries : {},
      diaryImages:next.diaryImages && typeof next.diaryImages==="object" ? next.diaryImages : {}
    };
  }

  function openDB(){
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function loadState(){
    const db = await openDB();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readonly");
      const req = tx.objectStore(STORE).get(STATE_KEY);
      req.onsuccess = () => resolve(normalizeState(req.result));
      req.onerror = () => reject(req.error);
    });
  }

  async function saveState(){
    const db = await openDB();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).put(state, STATE_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function styleById(id){
    return state.styles.find(s=>s.id===id) || null;
  }

  function styleImages(style){
    if(!style) return [];
    if(Array.isArray(style.images)){
      return style.images.map(x=>({
        id:x.id,
        data:x.data,
        positionX:Number.isFinite(x.positionX) ? x.positionX : 50,
        positionY:Number.isFinite(x.positionY) ? x.positionY : 50,
        zoom:Number.isFinite(x.zoom) ? x.zoom : 1,
        offsetX:Number.isFinite(x.offsetX) ? x.offsetX : 0,
        offsetY:Number.isFinite(x.offsetY) ? x.offsetY : 0
      }));
    }
    // v1互換：旧データの単一画像を配列として扱う
    if(style.imageData){
      return [{
        id:`legacy_${style.id}`,
        data:style.imageData,
        positionX:50,
        positionY:50,
        zoom:1,
        offsetX:0,
        offsetY:0
      }];
    }
    return [];
  }

  function clampCropOffset(value, zoom){
    const max = Math.max(0, (zoom - 1) * 50);
    return clamp(value, -max, max);
  }

  function cropTransform(image){
    const zoom = image?.zoom ?? 1;
    const ox = clampCropOffset(image?.offsetX ?? 0, zoom);
    const oy = clampCropOffset(image?.offsetY ?? 0, zoom);
    return `translate(${ox}%, ${oy}%) scale(${zoom})`;
  }

  function questById(id){
    return state.quests.find(q=>q.id===id) || null;
  }

  function completionFor(questId,date){
    return state.completions.find(c=>c.questId===questId && c.date===date) || null;
  }

  function firstCompletionForQuest(questId){
    return state.completions
      .filter(c=>c.questId===questId)
      .sort((a,b)=>a.date.localeCompare(b.date))[0] || null;
  }

  function questEligible(q,dateStr){
    if(dateStr < q.startDate) return false;
    if(q.retiredAt && dateStr >= q.retiredAt) return false;
    if(q.endDate && dateStr > q.endDate) return false;

    const d = parseDate(dateStr);

    if(q.type==="daily") return true;
    if(q.type==="weekday") return (q.weekdays || []).includes(d.getDay());

    if(q.type==="single"){
      if(dateStr < q.startDate) return false;
      if(!q.carryOver) return dateStr === q.startDate;

      const completed = firstCompletionForQuest(q.id);
      if(!completed) return true;
      return dateStr <= completed.date;
    }
    return false;
  }

  function questsForDate(dateStr){
    const eligible = state.quests
      .filter(q=>questEligible(q,dateStr))
      .sort((a,b)=>(a.order??0)-(b.order??0));

    const recordQuestIds = state.completions
      .filter(c=>c.date===dateStr)
      .map(c=>c.questId);

    for(const qid of recordQuestIds){
      if(!eligible.some(q=>q.id===qid)){
        const q = questById(qid);
        if(q) eligible.push(q);
      }
    }

    return eligible.sort((a,b)=>(a.order??0)-(b.order??0));
  }

  function formatHomeDate(dateStr){
    const d = parseDate(dateStr);
    return {
      date:`${d.getMonth()+1}/${d.getDate()}`,
      weekday:["日曜日","月曜日","火曜日","水曜日","木曜日","金曜日","土曜日"][d.getDay()]
    };
  }

  function renderHome(){
    const f = formatHomeDate(selectedDate);
    $("homeDate").textContent = f.date;
    $("homeWeekday").textContent = f.weekday;
    $("todayBtn").style.display = selectedDate===todayStr() ? "none" : "block";

    const grid = $("stampGrid");
    grid.innerHTML = "";

    const quests = questsForDate(selectedDate);
    if(!quests.length){
      const div = document.createElement("div");
      div.className = "empty";
      div.innerHTML = `この日のスタンプはありません<br><span style="font-size:12px">左上の＋から追加できます</span>`;
      grid.appendChild(div);
    } else {
      for(const q of quests){
        const completion = completionFor(q.id, selectedDate);
        const currentStyle = styleById(q.currentStyleId);
        const completedStyle = completion ? styleById(completion.styleId) : null;
        const style = completedStyle || currentStyle;

        const wrap = document.createElement("div");
        wrap.className = "stamp-wrap" + (reorderMode ? " reorderable" : "");
        wrap.dataset.questId = q.id;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "stamp " + (completion ? "on" : "off");
        btn.setAttribute("aria-label", `${q.name} ${completion ? "達成済み" : "未達成"}`);

        if(completion){
          const images = styleImages(style);
          const chosen = completion.chosenImageId
            ? images.find(x=>x.id===completion.chosenImageId)
            : images[0];

          if(chosen?.data){
            const img = document.createElement("img");
            img.src = chosen.data;
            img.alt = style?.name || q.name;
            img.style.objectPosition = `${chosen.positionX ?? 50}% ${chosen.positionY ?? 50}%`;
            img.style.transform = cropTransform(chosen);
            btn.appendChild(img);
          } else {
            btn.style.background = style?.color || "#d96c7a";
            btn.textContent = style?.stampText || style?.name || q.name;
          }
        } else {
          btn.textContent = q.name;
        }

        btn.addEventListener("click", ()=>{
          if(reorderMode) return;
          toggleCompletion(q, selectedDate);
        });

        bindReorderGesture(wrap, q);

        const caption = document.createElement("div");
        caption.className = "stamp-caption";
        caption.textContent = completion ? q.name : "";

        wrap.append(btn, caption);
        grid.appendChild(wrap);
      }
    }

    $("reorderBanner").classList.toggle("show", reorderMode);
    $("memoInput").value = state.memos[selectedDate] || "";
    $("diaryInput").value = state.diaries[selectedDate] || "";
    renderDiaryImages();
  }

  function enterReorderMode(){
    if(reorderMode) return;
    reorderMode = true;
    renderHome();
  }

  function exitReorderMode(){
    reorderMode = false;
    clearReorderDragVisuals();
    renderHome();
  }

  function clearReorderDragVisuals(){
    document.querySelectorAll(".stamp-wrap").forEach(el=>{
      el.classList.remove("dragging","drop-before","drop-after");
    });
    reorderDragQuestId = null;
    reorderDropQuestId = null;
  }

  function bindReorderGesture(wrap, q){
    wrap.addEventListener("touchstart", e=>{
      if(!e.touches.length) return;
      const t = e.touches[0];

      if(reorderMode){
        reorderDragQuestId = q.id;
        wrap.classList.add("dragging");
        e.preventDefault();
        return;
      }

      clearTimeout(reorderLongPressTimer);
      reorderTouchStart = {x:t.clientX, y:t.clientY};
      reorderLongPressTimer = setTimeout(enterReorderMode, 450);
    }, {passive:false});

    wrap.addEventListener("touchmove", e=>{
      if(!e.touches.length) return;
      const t = e.touches[0];

      if(!reorderMode){
        if(reorderTouchStart){
          const dist = Math.hypot(t.clientX-reorderTouchStart.x, t.clientY-reorderTouchStart.y);
          if(dist > 10){
            clearTimeout(reorderLongPressTimer);
            reorderLongPressTimer = null;
          }
        }
        return;
      }

      if(!reorderDragQuestId){
        reorderDragQuestId = q.id;
        wrap.classList.add("dragging");
      }
      updateReorderTarget(t.clientX, t.clientY);
      e.preventDefault();
    }, {passive:false});

    wrap.addEventListener("touchend", async e=>{
      clearTimeout(reorderLongPressTimer);
      reorderLongPressTimer = null;
      reorderTouchStart = null;

      if(reorderMode && reorderDragQuestId){
        await finishReorder();
        exitReorderMode();
        e.preventDefault();
      }
    }, {passive:false});

    wrap.addEventListener("touchcancel", ()=>{
      clearTimeout(reorderLongPressTimer);
      reorderLongPressTimer = null;
      reorderTouchStart = null;
      clearReorderDragVisuals();
    }, {passive:true});

    // PCでも確認できるようにドラッグ対応
    wrap.draggable = reorderMode;
    wrap.addEventListener("dragstart", e=>{
      if(!reorderMode){
        e.preventDefault();
        return;
      }
      reorderDragQuestId = q.id;
      wrap.classList.add("dragging");
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", q.id);
      }
    });
    wrap.addEventListener("dragover", e=>{
      if(!reorderMode || !reorderDragQuestId) return;
      e.preventDefault();
      updateReorderTarget(e.clientX, e.clientY);
    });
    wrap.addEventListener("drop", async e=>{
      if(!reorderMode) return;
      e.preventDefault();
      await finishReorder();
      exitReorderMode();
    });
    wrap.addEventListener("dragend", clearReorderDragVisuals);
  }

  function updateReorderTarget(x,y){
    document.querySelectorAll(".stamp-wrap").forEach(node=>{
      node.classList.remove("drop-before","drop-after");
    });

    const hit = document.elementFromPoint(x,y);
    const el = hit && hit.closest ? hit.closest(".stamp-wrap") : null;

    if(!el || el.dataset.questId===reorderDragQuestId){
      reorderDropQuestId = null;
      return;
    }

    const rect = el.getBoundingClientRect();
    reorderDropQuestId = el.dataset.questId;

    // 2Dグリッドなので、左右位置で前/後を決める
    reorderDropSide = x < rect.left + rect.width/2 ? "before" : "after";
    el.classList.add(reorderDropSide==="before" ? "drop-before" : "drop-after");
  }

  async function finishReorder(){
    const draggedId = reorderDragQuestId;
    const targetId = reorderDropQuestId;

    if(!draggedId || !targetId || draggedId===targetId){
      clearReorderDragVisuals();
      return;
    }

    const visibleIds = questsForDate(selectedDate).map(q=>q.id);
    const newVisible = visibleIds.filter(id=>id!==draggedId);
    let targetIndex = newVisible.indexOf(targetId);
    if(targetIndex < 0){
      clearReorderDragVisuals();
      return;
    }
    if(reorderDropSide==="after") targetIndex += 1;
    newVisible.splice(targetIndex,0,draggedId);

    // 対象外日のスタンプは位置を保ち、今日表示されるスタンプだけ差し替える
    const allOrdered = [...state.quests]
      .sort((a,b)=>(a.order??0)-(b.order??0))
      .map(q=>q.id);

    const visibleSet = new Set(visibleIds);
    const queue = [...newVisible];
    const merged = allOrdered.map(id => visibleSet.has(id) ? queue.shift() : id);

    merged.forEach((id,index)=>{
      const q = questById(id);
      if(q) q.order = index;
    });

    await saveState();
    clearReorderDragVisuals();
    renderHome();
  }

  function diaryImagesFor(dateStr){
    const arr = state.diaryImages?.[dateStr];
    return Array.isArray(arr) ? arr : [];
  }

  function renderDiaryImages(){
    const root = $("diaryImages");
    root.innerHTML = "";

    const add = document.createElement("button");
    add.type = "button";
    add.className = "diary-image-add";
    add.textContent = "＋";
    add.setAttribute("aria-label","日記に画像を追加");
    add.addEventListener("click",()=>$("diaryImageInput").click());
    root.appendChild(add);

    diaryImagesFor(selectedDate).forEach((image,index)=>{
      const item = document.createElement("div");
      item.className = "diary-image-item";

      const thumb = document.createElement("button");
      thumb.type = "button";
      thumb.className = "diary-image-thumb";
      thumb.setAttribute("aria-label",`日記画像${index+1}を拡大`);

      const img = document.createElement("img");
      img.src = image.data;
      img.alt = `日記画像 ${index+1}`;
      thumb.appendChild(img);

      thumb.addEventListener("click",()=>{
        $("photoViewerImage").src = image.data;
        openOverlay("photoViewerOverlay");
      });

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "diary-image-remove";
      remove.textContent = "×";
      remove.setAttribute("aria-label",`日記画像${index+1}を削除`);
      remove.addEventListener("click", async e=>{
        e.stopPropagation();
        const arr = diaryImagesFor(selectedDate).filter(x=>x.id!==image.id);
        if(arr.length) state.diaryImages[selectedDate] = arr;
        else delete state.diaryImages[selectedDate];
        await saveState();
        renderDiaryImages();
        renderCalendar();
      });

      item.append(thumb,remove);
      root.appendChild(item);
    });
  }

  async function diaryImageFileToDataURL(file){
    if(!file.type || !file.type.startsWith("image/")){
      throw new Error("画像ファイルを選んでください");
    }

    const raw = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = ()=>reject(reader.error);
      reader.readAsDataURL(file);
    });

    const img = await new Promise((resolve,reject)=>{
      const im = new Image();
      im.onload = ()=>resolve(im);
      im.onerror = ()=>reject(new Error("画像を読み込めませんでした"));
      im.src = raw;
    });

    const max = 1280;
    const scale = Math.min(1, max/Math.max(img.width,img.height));
    const w = Math.max(1,Math.round(img.width*scale));
    const h = Math.max(1,Math.round(img.height*scale));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);

    const webp = canvas.toDataURL("image/webp",.82);
    return webp.startsWith("data:image/webp") ? webp : canvas.toDataURL("image/jpeg",.84);
  }

  async function toggleCompletion(q,dateStr){
    const existing = completionFor(q.id,dateStr);

    if(existing){
      state.completions = state.completions.filter(c=>c.id!==existing.id);
      await saveState();
      renderHome();
      renderCalendar();
      return;
    }

    if(q.type==="single"){
      state.completions = state.completions.filter(c=>c.questId!==q.id);
    }

    const style = styleById(q.currentStyleId);
    const images = styleImages(style);

    let chosenImageId = null;
    if(images.length){
      let candidates = images;
      if(images.length > 1 && q.lastImageId){
        const filtered = images.filter(x=>x.id !== q.lastImageId);
        if(filtered.length) candidates = filtered;
      }
      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      chosenImageId = chosen?.id || null;
      q.lastImageId = chosenImageId;
    }

    state.completions.push({
      id:uid("done"),
      questId:q.id,
      date:dateStr,
      styleId:q.currentStyleId,
      chosenImageId,
      createdAt:new Date().toISOString()
    });

    await saveState();
    playStampSound();
    renderHome();
    renderCalendar();
  }

  function playStampSound(){
    try{
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(560, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + .075);
      gain.gain.setValueAtTime(.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.18, ctx.currentTime + .008);
      gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .11);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + .12);
    }catch(e){}
  }

  function renderCalendar(){
    const y = calendarCursor.getFullYear();
    const m = calendarCursor.getMonth();
    $("calendarTitle").textContent = `${y}年 ${m+1}月`;

    const grid = $("calendarGrid");
    grid.innerHTML = "";

    const first = new Date(y,m,1,12);
    const start = new Date(y,m,1-first.getDay(),12);

    for(let i=0;i<42;i++){
      const d = new Date(start);
      d.setDate(start.getDate()+i);
      const ds = toDateStr(d);

      const btn = document.createElement("button");
      btn.className = "day";
      if(!sameMonth(d,first)) btn.classList.add("out");
      if(ds===todayStr()) btn.classList.add("today");
      if(ds===selectedDate) btn.classList.add("selected");

      const num = document.createElement("div");
      num.className = "day-num";
      num.textContent = d.getDate();

      if(diaryImagesFor(ds).length){
        const photoMark = document.createElement("span");
        photoMark.className = "day-photo-indicator";
        photoMark.textContent = "📷";
        btn.appendChild(photoMark);
      }

      const minis = document.createElement("div");
      minis.className = "mini-stamps";

      const comps = state.completions
        .filter(c=>c.date===ds)
        .sort((a,b)=>a.createdAt.localeCompare(b.createdAt));

      const shown = comps.slice(0,4);
      for(const c of shown){
        const s = styleById(c.styleId);
        const mini = document.createElement("span");
        mini.className = "mini-stamp";
        const imgs = styleImages(s);
        const chosen = c.chosenImageId ? imgs.find(x=>x.id===c.chosenImageId) : imgs[0];
        if(chosen?.data){
          const miniImg = document.createElement("img");
          miniImg.src = chosen.data;
          miniImg.alt = "";
          miniImg.style.objectPosition = `${chosen.positionX ?? 50}% ${chosen.positionY ?? 50}%`;
          miniImg.style.transform = cropTransform(chosen);
          mini.appendChild(miniImg);
        }else{
          mini.style.background = s?.color || "#777";
        }
        minis.appendChild(mini);
      }

      if(comps.length>4){
        const more = document.createElement("span");
        more.className = "mini-more";
        more.textContent = `+${comps.length-4}`;
        minis.appendChild(more);
      }

      btn.append(num,minis);
      btn.addEventListener("click",()=>{
        selectedDate = ds;
        showScreen("home");
        renderHome();
      });

      grid.appendChild(btn);
    }
  }

    $("calendarScreen").classList.toggle("active",!home);

  function recurrenceLabel(q){
    if(q.type==="daily") return "毎日";
    if(q.type==="weekday"){
      const names=["日","月","火","水","木","金","土"];
      return (q.weekdays||[]).map(x=>names[x]).join("・");
    }
    return q.carryOver ? "単発・持ち越し" : "単発";
  }

  function renderManage(){
    const list = $("manageList");
    list.innerHTML = "";

    const quests = [...state.quests].sort((a,b)=>(a.order??0)-(b.order??0));
    if(!quests.length){
      list.innerHTML = `<div class="help" style="padding:12px 4px">まだスタンプがありません。</div>`;

      const item = document.createElement("div");
      item.className = "manage-item";

      const left = document.createElement("div");
      const title = document.createElement("div");
      title.className = "manage-title";
      title.textContent = q.name + (q.retiredAt ? "（終了）" : "");

      meta.className = "manage-meta";

      meta.textContent = `${recurrenceLabel(q)} / ${dates}`;

          q.retiredAt = todayStr();

        await saveState();

      actions.append(edit,retire);

  function clamp(n,min,max){
    return Math.max(min,Math.min(max,n));
  }

  function applyCropPreview(){
    if(editingCropIndex===null) return;
    const image = pendingImages[editingCropIndex];
    if(!image) return;
    const zoom = image.zoom ?? 1;
    $("cropPreviewImage").src = image.data;
    $("cropPreviewImage").style.objectPosition =
      `${image.positionX ?? 50}% ${image.positionY ?? 50}%`;
    $("cropPreviewImage").style.transform = cropTransform(image);
    $("cropZoomRange").value = Math.round(zoom * 100);
    $("cropZoomValue").textContent = `${Math.round(zoom * 100)}%`;
  }

  function openCropEditor(index){
    if(!pendingImages[index]) return;
    editingCropIndex = index;
    applyCropPreview();
    openOverlay("cropOverlay");
  }

  function closeCropEditor(){
    editingCropIndex = null;
    cropDrag = null;
    closeOverlay("cropOverlay");
    renderImageGallery();
  }

  $("cropPreview").addEventListener("pointerdown", e=>{
    if(editingCropIndex===null) return;
    const image = pendingImages[editingCropIndex];
    cropDrag = {
      pointerId:e.pointerId,
      startX:e.clientX,
      startY:e.clientY,
      startPX:image.positionX ?? 50,
      startPY:image.positionY ?? 50,
      startOX:image.offsetX ?? 0,
      startOY:image.offsetY ?? 0
    };
    try{$("cropPreview").setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });

  $("cropPreview").addEventListener("pointermove", e=>{
    if(!cropDrag || e.pointerId!==cropDrag.pointerId || editingCropIndex===null) return;
    const rect = $("cropPreview").getBoundingClientRect();
    const dx = e.clientX - cropDrag.startX;
    const dy = e.clientY - cropDrag.startY;

    const image = pendingImages[editingCropIndex];
    const zoom = image.zoom ?? 1;

    if(zoom > 1.001){
      // 拡大中は、拡大で生まれた余白の範囲内を上下左右に移動
      const dxPct = (dx / rect.width) * 100;
      const dyPct = (dy / rect.height) * 100;
      image.offsetX = clampCropOffset(cropDrag.startOX + dxPct, zoom);
      image.offsetY = clampCropOffset(cropDrag.startOY + dyPct, zoom);
    }else{
      // 100%では従来どおり元画像の切り抜き位置を調整
      image.positionX = clamp(cropDrag.startPX - (dx / rect.width) * 100, 0, 100);
      image.positionY = clamp(cropDrag.startPY - (dy / rect.height) * 100, 0, 100);
      image.offsetX = 0;
      image.offsetY = 0;
    }
    applyCropPreview();
    e.preventDefault();
  });

  function endCropDrag(e){
    if(!cropDrag) return;
    if(e && e.pointerId!==undefined && e.pointerId!==cropDrag.pointerId) return;
    cropDrag = null;
  }
  $("cropPreview").addEventListener("pointerup", endCropDrag);
  $("cropPreview").addEventListener("pointercancel", endCropDrag);

  // iOS向け：1本指で位置調整、2本指でピンチ拡大縮小
  let cropPinch = null;

  function touchDistance(t1,t2){
    return Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
  }

  $("cropPreview").addEventListener("touchstart", e=>{
    if(editingCropIndex===null) return;
    const image = pendingImages[editingCropIndex];

    if(e.touches.length >= 2){
      const [t1,t2] = e.touches;
      cropPinch = {
        startDistance: touchDistance(t1,t2),
        startZoom: image.zoom ?? 1
      };
      cropDrag = null;
      e.preventDefault();
      return;
    }

    if(e.touches.length===1){
      const t = e.touches[0];
      cropDrag = {
        pointerId:"touch",
        startX:t.clientX,
        startY:t.clientY,
        startPX:image.positionX ?? 50,
        startPY:image.positionY ?? 50,
        startOX:image.offsetX ?? 0,
        startOY:image.offsetY ?? 0
      };
      cropPinch = null;
      e.preventDefault();
    }
  }, {passive:false});

  $("cropPreview").addEventListener("touchmove", e=>{
    if(editingCropIndex===null) return;
    const image = pendingImages[editingCropIndex];

    if(e.touches.length >= 2 && cropPinch){
      const [t1,t2] = e.touches;
      const ratio = touchDistance(t1,t2) / cropPinch.startDistance;
      image.zoom = clamp(cropPinch.startZoom * ratio, 1, 3);
      image.offsetX = clampCropOffset(image.offsetX ?? 0, image.zoom);
      image.offsetY = clampCropOffset(image.offsetY ?? 0, image.zoom);
      applyCropPreview();
      e.preventDefault();
      return;
    }

    if(e.touches.length===1 && cropDrag?.pointerId==="touch"){
      const t = e.touches[0];
      const rect = $("cropPreview").getBoundingClientRect();
      const dx = t.clientX - cropDrag.startX;
      const dy = t.clientY - cropDrag.startY;
      const zoom = image.zoom ?? 1;
      if(zoom > 1.001){
        const dxPct = (dx / rect.width) * 100;
        const dyPct = (dy / rect.height) * 100;
        image.offsetX = clampCropOffset(cropDrag.startOX + dxPct, zoom);
        image.offsetY = clampCropOffset(cropDrag.startOY + dyPct, zoom);
      }else{
        image.positionX = clamp(cropDrag.startPX - (dx / rect.width) * 100, 0, 100);
        image.positionY = clamp(cropDrag.startPY - (dy / rect.height) * 100, 0, 100);
        image.offsetX = 0;
        image.offsetY = 0;
      }
      applyCropPreview();
      e.preventDefault();
    }
  }, {passive:false});

  $("cropPreview").addEventListener("touchend", e=>{
    if(e.touches.length < 2) cropPinch = null;
    if(e.touches.length===0) cropDrag = null;
  }, {passive:true});

  $("cropPreview").addEventListener("touchcancel", ()=>{
    cropDrag = null;
    cropPinch = null;
  }, {passive:true});

  $("cropPreview").addEventListener("wheel", e=>{
    if(editingCropIndex===null) return;
    const image = pendingImages[editingCropIndex];
    const delta = e.deltaY < 0 ? 0.08 : -0.08;
    image.zoom = clamp((image.zoom ?? 1) + delta, 1, 3);
    image.offsetX = clampCropOffset(image.offsetX ?? 0, image.zoom);
    image.offsetY = clampCropOffset(image.offsetY ?? 0, image.zoom);
    applyCropPreview();
    e.preventDefault();
  }, {passive:false});

  $("cropZoomRange").addEventListener("input",()=>{
    if(editingCropIndex===null) return;
    const image = pendingImages[editingCropIndex];
    image.zoom = clamp(Number($("cropZoomRange").value) / 100, 1, 3);
    image.offsetX = clampCropOffset(image.offsetX ?? 0, image.zoom);
    image.offsetY = clampCropOffset(image.offsetY ?? 0, image.zoom);
    applyCropPreview();
  });

  async function imageFileToDataURL(file){
    if(!file.type || !file.type.startsWith("image/")){
      throw new Error("画像ファイルを選んでください");
    }

    const raw = await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = ()=>reject(reader.error);
      reader.readAsDataURL(file);
    });

    const img = await new Promise((resolve,reject)=>{
      const im = new Image();
      im.onload = ()=>resolve(im);
      im.onerror = ()=>reject(new Error("画像を読み込めませんでした"));
      im.src = raw;
    });

    const max = 512;
    const scale = Math.min(1, max/Math.max(img.width,img.height));
    const w = Math.max(1,Math.round(img.width*scale));
    const h = Math.max(1,Math.round(img.height*scale));
    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);

    const webp = canvas.toDataURL("image/webp",.86);
    return webp.startsWith("data:image/webp") ? webp : canvas.toDataURL("image/png");
  }

  $("questForm").addEventListener("submit", async e=>{
    e.preventDefault();

    const id = $("questId").value || null;
    const name = $("questName").value.trim();
    const type = $("questType").value;
    const startDate = $("startDate").value;
    const endDate = type==="single" ? null : ($("endDate").value || null);
    const weekdays = [...document.querySelectorAll('#weekdayField input[type="checkbox"]:checked')].map(x=>Number(x.value));
    const carryOver = type==="single" ? $("carryOver").checked : false;

    if(!name || !startDate) return;
    if(type==="weekday" && weekdays.length===0){
      alert("曜日を1つ以上選んでください");
      return;
    }
    if(endDate && endDate < startDate){
      alert("終了日は開始日以降にしてください");
      return;
    }

    const stampText = $("stampText").value.trim();
    const color = $("stampColor").value || "#d96c7a";

    if(id){
      const q = questById(id);
      const oldStyle = styleById(q.currentStyleId);
      const oldImages = styleImages(oldStyle);
      const oldSignature = JSON.stringify(oldImages.map(x=>[
        x.id,x.data,x.positionX ?? 50,x.positionY ?? 50,x.zoom ?? 1,x.offsetX ?? 0,x.offsetY ?? 0
      ]));
      const newSignature = JSON.stringify(pendingImages.map(x=>[
        x.id,x.data,x.positionX ?? 50,x.positionY ?? 50,x.zoom ?? 1,x.offsetX ?? 0,x.offsetY ?? 0
      ]));

      const styleChanged =
        !oldStyle ||
        oldStyle.name !== name ||
        (oldStyle.stampText||"") !== stampText ||
        (oldStyle.color||"") !== color ||
        oldSignature !== newSignature;

      if(styleChanged){
        const newStyle = {
          id:uid("style"),
          questId:q.id,
          name,
          stampText,
          color,
          images:pendingImages.map(x=>({
            id:x.id,
            data:x.data,
            positionX:x.positionX ?? 50,
            positionY:x.positionY ?? 50,
            zoom:x.zoom ?? 1,
            offsetX:x.offsetX ?? 0,
            offsetY:x.offsetY ?? 0
          })),
          createdAt:new Date().toISOString()
        };
        state.styles.push(newStyle);
        q.currentStyleId = newStyle.id;
      }

      q.name = name;
      q.type = type;
      q.startDate = startDate;
      q.endDate = endDate;
      q.weekdays = weekdays;
      q.carryOver = carryOver;
      q.updatedAt = new Date().toISOString();
    }else{
      const qid = uid("quest");
      const styleId = uid("style");
      const order = state.quests.length ? Math.max(...state.quests.map(q=>q.order??0))+1 : 0;

      state.styles.push({
        id:styleId,
        questId:qid,
        name,
        stampText,
        color,
        images:pendingImages.map(x=>({
          id:x.id,
          data:x.data,
          positionX:x.positionX ?? 50,
          positionY:x.positionY ?? 50,
          zoom:x.zoom ?? 1,
          offsetX:x.offsetX ?? 0,
          offsetY:x.offsetY ?? 0
        })),
        createdAt:new Date().toISOString()
      });

      state.quests.push({
        id:qid,
        name,
        type,
        startDate,
        endDate,
        weekdays,
        carryOver,
        retiredAt:null,
        currentStyleId:styleId,
        lastImageId:null,
        order,
        createdAt:new Date().toISOString(),
        updatedAt:new Date().toISOString()
      });
    }

    await saveState();
    closeOverlay("questOverlay");
    renderHome();
    renderManage();
    renderCalendar();
  });
