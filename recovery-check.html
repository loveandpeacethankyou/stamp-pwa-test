<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stamp Card Recovery Check</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#f4f0e8;color:#292724;margin:0;padding:24px}
  main{max-width:620px;margin:0 auto}
  .card{background:#fffdf8;border:1px solid #ddd6cb;border-radius:18px;padding:16px;margin:12px 0}
  button{font:inherit;border:0;border-radius:12px;padding:10px 13px;background:#292724;color:#fff;font-weight:700}
  pre{white-space:pre-wrap;word-break:break-word;background:#f3eee6;padding:12px;border-radius:12px;font-size:13px}
  .ok{color:#176b2b}.bad{color:#a13a3a}.muted{color:#777}
</style>
</head>
<body>
<main>
  <h1>Stamp Card データ確認</h1>
  <p class="muted">このページは読み取り専用です。データの書き込み・削除はしません。</p>
  <div class="card">
    <button id="checkBtn">データを確認</button>
    <button id="downloadBtn" style="display:none;margin-left:8px">見つかったデータを保存</button>
    <pre id="out">未確認</pre>
  </div>
</main>
<script>
(() => {
  const out = document.getElementById("out");
  const downloadBtn = document.getElementById("downloadBtn");
  let foundState = null;

  function line(s=""){ out.textContent += s + "\n"; }
  function reset(){ out.textContent = ""; }

  async function openDBReadonly(name){
    return new Promise((resolve,reject)=>{
      let created = false;
      const req = indexedDB.open(name);
      req.onupgradeneeded = () => {
        // 存在しないDBを誤って作った場合は後で閉じて削除する
        created = true;
      };
      req.onsuccess = () => resolve({db:req.result, created});
      req.onerror = () => reject(req.error);
    });
  }

  async function readState(){
    reset();
    line("確認中…");
    line("");

    if (indexedDB.databases) {
      try {
        const dbs = await indexedDB.databases();
        line("このサイトに見えるIndexedDB:");
        if (!dbs.length) line("  （なし）");
        dbs.forEach(d=>line(`  - ${d.name || "(名前なし)"} / version ${d.version ?? "?"}`));
        line("");
      } catch(e) {
        line("IndexedDB一覧取得: 非対応または失敗");
        line("");
      }
    }

    let handle;
    try{
      handle = await openDBReadonly("stamp-card-app");
    }catch(e){
      line("stamp-card-app を開けませんでした: " + e);
      return;
    }

    const db = handle.db;

    if(handle.created){
      line("stamp-card-app が元々存在しませんでした。");
      db.close();
      try{ indexedDB.deleteDatabase("stamp-card-app"); }catch(_){}
      return;
    }

    line(`stamp-card-app: 存在 / version ${db.version}`);
    line("object stores: " + [...db.objectStoreNames].join(", "));

    if(!db.objectStoreNames.contains("kv")){
      line("kv ストアがありません。");
      db.close();
      return;
    }

    const result = await new Promise((resolve,reject)=>{
      const tx = db.transaction("kv","readonly");
      const store = tx.objectStore("kv");
      const keysReq = store.getAllKeys();
      const valsReq = store.getAll();
      tx.oncomplete = ()=>resolve({keys:keysReq.result, vals:valsReq.result});
      tx.onerror = ()=>reject(tx.error);
    });

    db.close();

    line("");
    line("kv keys:");
    result.keys.forEach(k=>line("  - " + String(k)));

    const idx = result.keys.findIndex(k=>k==="state");
    if(idx<0){
      line("");
      line("state キーが見つかりませんでした。");
      return;
    }

    foundState = result.vals[idx];
    line("");
    line("state が見つかりました。");
    if(foundState && typeof foundState==="object"){
      line(`quests: ${Array.isArray(foundState.quests)?foundState.quests.length:"?"}`);
      line(`styles: ${Array.isArray(foundState.styles)?foundState.styles.length:"?"}`);
      line(`completions: ${Array.isArray(foundState.completions)?foundState.completions.length:"?"}`);
      line(`memos: ${foundState.memos && typeof foundState.memos==="object"?Object.keys(foundState.memos).length:"?"}`);
      line(`diaries: ${foundState.diaries && typeof foundState.diaries==="object"?Object.keys(foundState.diaries).length:"?"}`);
      line(`diaryImages days: ${foundState.diaryImages && typeof foundState.diaryImages==="object"?Object.keys(foundState.diaryImages).length:"?"}`);
      downloadBtn.style.display = "inline-block";
    }else{
      line("state の中身が空/不正です。");
    }
  }

  document.getElementById("checkBtn").addEventListener("click",()=>{
    readState().catch(e=>{
      line("");
      line("エラー: " + (e?.message || e));
    });
  });

  downloadBtn.addEventListener("click",()=>{
    if(!foundState) return;
    const payload = {
      app:"stamp-card-recovery",
      exportedAt:new Date().toISOString(),
      state:foundState
    };
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "stamp-card-recovery.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
})();
</script>
</body>
</html>
