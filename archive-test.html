<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e8">
  <title>ARCHIVE TEST</title>
  <style>
    :root{
      --bg:#f4f0e8; --paper:#fffdf8; --ink:#292724; --muted:#8c877f;
      --line:#ddd6cb; --soft:#ece6dc; --shadow:0 10px 30px rgba(55,45,30,.08);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink); background:var(--bg);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:var(--bg)}
    body{min-height:100vh;-webkit-tap-highlight-color:transparent;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
    button,select{font:inherit}
    button{cursor:pointer;touch-action:manipulation}
    .app{width:min(100%,560px);margin:0 auto;min-height:100vh;padding:calc(12px + env(safe-area-inset-top)) 16px 28px}
    .topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:48px;margin-bottom:10px}
    .topbar h1{margin:0;text-align:center;font-size:17px;font-weight:750;letter-spacing:.04em}
    .icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--ink);display:grid;place-items:center;font-size:25px;line-height:1;padding:0}
    .icon-btn:active{background:var(--soft)}
    .archive-card{background:var(--paper);border:1px solid rgba(90,75,50,.08);border-radius:24px;box-shadow:var(--shadow);padding:14px;min-height:360px}
    .archive-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .filter-wrap{position:relative;flex:1 1 auto;min-width:0}
    .archive-filter{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);padding:10px 36px 10px 12px;outline:none;appearance:none;font-size:13px}
    .filter-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px}
    .category-btn{border:0;border-radius:13px;background:var(--soft);color:var(--ink);padding:10px 12px;font-size:12px;font-weight:700;white-space:nowrap}
    .archive-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 11px;align-items:start;min-height:250px}
    .empty{grid-column:1/-1;min-height:250px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;padding:30px 12px}
    .empty strong{display:block;margin-bottom:4px;color:#746f68;font-size:14px}
    .note{margin-top:12px;text-align:center;color:#a39c93;font-size:10px}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="icon-btn" type="button" aria-label="作品を追加" id="addBtn">＋</button>
      <h1>ARCHIVE</h1>
      <button class="icon-btn" type="button" aria-label="カテゴリー管理" id="categoryBtn">⚙︎</button>
    </header>

    <section class="archive-card">
      <div class="archive-toolbar">
        <div class="filter-wrap">
          <select class="archive-filter" id="categoryFilter" aria-label="カテゴリーで絞り込み">
            <option value="all">すべて</option>
          </select>
          <span class="filter-arrow">▼</span>
        </div>
        <button class="category-btn" type="button" id="categoryManageBtn">カテゴリー</button>
      </div>

      <div class="archive-grid" id="archiveGrid">
        <div class="empty">
          <div>
            <strong>まだ作品はありません</strong>
            次の段階で、ここに作品を登録できるようにします。
          </div>
        </div>
      </div>
    </section>

    <div class="note">ARCHIVE TEST v0.1 — 本体とは独立した試作ページ</div>
  </main>

  <script>
    // Step 1: layout only.
    // Later integration plan:
    // item = { id, title, categoryId, rating, comment, image, createdAt, updatedAt }
    // category = { id, name, sortOrder }
    // This prototype intentionally does not write to the Stamp Card database.
    const notYet = () => alert("このボタンの機能は次の段階で追加します。");
    document.getElementById("addBtn").addEventListener("click", notYet);
    document.getElementById("categoryBtn").addEventListener("click", notYet);
    document.getElementById("categoryManageBtn").addEventListener("click", notYet);
  </script>
</body>
</html>
